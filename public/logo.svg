<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b64eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)"/>
  
  <!-- Pill shape -->
  <rect x="50" y="65" width="100" height="70" rx="35" fill="white" transform="rotate(-15 100 100)"/>
  
  <!-- Medical cross on pill -->
  <rect x="85" y="85" width="30" height="12" rx="3" fill="#1b64eb"/>
  <rect x="94" y="76" width="12" height="30" rx="3" fill="#1b64eb"/>
  
  <!-- Lens/magnifying glass -->
  <circle cx="145" cy="135" r="30" fill="white" stroke="#1b64eb" stroke-width="4"/>
  <line x1="168" y1="158" x2="185" y2="175" stroke="white" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Shine effect -->
  <ellipse cx="75" cy="55" rx="15" ry="8" fill="white" opacity="0.3" transform="rotate(-30 75 55)"/>
</svg>